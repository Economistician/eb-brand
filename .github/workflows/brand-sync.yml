name: Sync brand assets to downstream repos

on:
  push:
    branches: [main]
    paths:
      - "electric-barometer/favicon/**"
      - "electric-barometer/icons/**"
      - "electric-barometer/logo/**"
      - "electric-barometer/tokens/**"
      - "electric-barometer/scripts/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- eb-docs ----
          - repo: economistician/eb-docs
            dest_root: docs/assets/brand
            css_dest: docs/stylesheets

          # ---- electric-barometer-site ----
          - repo: economistician/electric-barometer-site
            dest_root: assets
            css_dest: assets/css

    steps:
      - name: Checkout eb-brand (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate brand color artifacts
        run: |
          set -euo pipefail
          python source/electric-barometer/scripts/build_colors.py

      - name: Checkout downstream repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.BRAND_SYNC_TOKEN }}
          path: target

      - name: Sync favicon/icons/logo
        shell: bash
        run: |
          set -euo pipefail

          SRC="source/electric-barometer"
          DEST="target/${{ matrix.dest_root }}"

          mkdir -p "${DEST}/favicon" "${DEST}/icons" "${DEST}/logo"

          if [ ! -d "${SRC}/icons" ]; then
            echo "ERROR: Missing source directory: ${SRC}/icons"
            exit 1
          fi
          if [ -z "$(ls -A "${SRC}/icons" 2>/dev/null)" ]; then
            echo "ERROR: Source icons directory is empty: ${SRC}/icons"
            exit 1
          fi

          rsync -a --delete "${SRC}/favicon/" "${DEST}/favicon/"
          rsync -a --delete "${SRC}/icons/"  "${DEST}/icons/"
          rsync -a --delete "${SRC}/logo/"   "${DEST}/logo/"

      - name: Sync generated color CSS
        shell: bash
        run: |
          set -euo pipefail

          SRC="source/electric-barometer/dist"
          DEST="target/${{ matrix.css_dest }}"

          mkdir -p "${DEST}"

          rsync -a "${SRC}/tokens.css"           "${DEST}/eb-brand-tokens.css"
          rsync -a "${SRC}/mkdocs-material.css"  "${DEST}/eb-brand-colors.css"

      - name: Review changes
        run: |
          cd target
          git status --porcelain

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BRAND_SYNC_TOKEN }}
          path: target
          commit-message: "chore(brand): sync assets and color tokens from eb-brand @ ${{ github.sha }}"
          branch: "chore/brand-sync-${{ github.run_id }}-${{ matrix.repo }}"
          title: "chore(brand): sync brand assets and color tokens"
          body: |
            Automated sync from `eb-brand` commit `${{ github.sha }}`.

            Source:
            - `electric-barometer/favicon/`
            - `electric-barometer/icons/`
            - `electric-barometer/logo/`
            - Generated from `electric-barometer/tokens/colors.json`

            Destination:
            - `${{ matrix.dest_root }}/`
            - `${{ matrix.css_dest }}/eb-brand-tokens.css`
            - `${{ matrix.css_dest }}/eb-brand-colors.css`

            Notes:
            - CSS is auto-generated via `build_colors.py`
            - Downstream repos should treat these files as read-only
          labels: |
            brand
            automation

      - name: Enable auto-merge (squash)
        if: ${{ steps.cpr.outputs.pull-request-url != '' }}
        shell: bash
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          GH_TOKEN: ${{ secrets.BRAND_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(echo "${PR_URL}" | sed -n 's#.*/pull/\([0-9]\+\).*#\1#p')"

          if [ -z "${PR_NUMBER}" ]; then
            echo "ERROR: Could not parse PR number from URL: ${PR_URL}"
            exit 1
          fi

          gh pr merge "${PR_NUMBER}" --repo "${{ matrix.repo }}" --squash --auto
