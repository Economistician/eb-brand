name: Sync brand assets to downstream repos

on:
  push:
    branches: [main]
    paths:
      - "electric-barometer/favicon/**"
      - "electric-barometer/icons/**"
      - "electric-barometer/logo/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- eb-docs ----
          - repo: economistician/eb-docs
            dest_root: docs/assets/brand

          # ---- electric-barometer-site ----
          - repo: economistician/electric-barometer-site
            dest_root: assets

    steps:
      - name: Checkout eb-brand (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout downstream repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.BRAND_SYNC_TOKEN }}
          path: target

      - name: Sync favicon/icons/logo
        shell: bash
        run: |
          set -euo pipefail

          SRC="source/electric-barometer"
          DEST="target/${{ matrix.dest_root }}"

          mkdir -p "${DEST}/favicon" "${DEST}/icons" "${DEST}/logo"

          # Ensure icons are actually present in source (fail fast if missing/empty)
          if [ ! -d "${SRC}/icons" ]; then
            echo "ERROR: Missing source directory: ${SRC}/icons"
            exit 1
          fi
          if [ -z "$(ls -A "${SRC}/icons" 2>/dev/null)" ]; then
            echo "ERROR: Source icons directory is empty: ${SRC}/icons"
            exit 1
          fi

          rsync -a --delete "${SRC}/favicon/" "${DEST}/favicon/"
          rsync -a --delete "${SRC}/icons/"  "${DEST}/icons/"
          rsync -a --delete "${SRC}/logo/"   "${DEST}/logo/"

          cd target
          git status --porcelain

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BRAND_SYNC_TOKEN }}
          path: target
          commit-message: "chore(brand): sync assets from eb-brand @ ${{ github.sha }}"
          branch: "chore/brand-sync-${{ github.run_id }}-${{ matrix.repo }}"
          title: "chore(brand): sync brand assets from eb-brand"
          body: |
            Automated sync from `eb-brand` commit `${{ github.sha }}`.

            Source:
            - `eb-brand/electric-barometer/favicon/`
            - `eb-brand/electric-barometer/icons/`
            - `eb-brand/electric-barometer/logo/`

            Destination:
            - `${{ matrix.dest_root }}/favicon/`
            - `${{ matrix.dest_root }}/icons/`
            - `${{ matrix.dest_root }}/logo/`
          labels: |
            brand
            automation

      - name: Enable auto-merge (squash)
        if: ${{ steps.cpr.outputs.pull-request-url != '' }}
        shell: bash
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          GH_TOKEN: ${{ secrets.BRAND_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # PR URL looks like: https://github.com/OWNER/REPO/pull/123
          PR_NUMBER="$(echo "${PR_URL}" | sed -n 's#.*/pull/\([0-9]\+\).*#\1#p')"

          if [ -z "${PR_NUMBER}" ]; then
            echo "ERROR: Could not parse PR number from URL: ${PR_URL}"
            exit 1
          fi

          echo "Enabling auto-merge for PR #${PR_NUMBER} (${PR_URL})"
          gh pr merge "${PR_NUMBER}" --repo "${{ matrix.repo }}" --squash --auto
